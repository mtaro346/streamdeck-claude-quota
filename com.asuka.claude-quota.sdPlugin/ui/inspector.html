<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Claude Quota Settings</title>
  <script src="vendor/sdpi-components.js"></script>
</head>
<body>
  <sdpi-item label="Font family">
    <sdpi-textfield setting="fontFamily" default="Helvetica, Arial, sans-serif"></sdpi-textfield>
  </sdpi-item>

  <details open>
    <summary>Bars</summary>
    <sdpi-item label="5H bar color">
      <sdpi-color setting="sessionColor" default="#d97757"></sdpi-color>
    </sdpi-item>
    <sdpi-item label="7D bar color">
      <sdpi-color setting="weeklyColor" default="#e0a34e"></sdpi-color>
    </sdpi-item>
    <sdpi-item label="Fable bar color">
      <sdpi-color setting="fableColor" default="#a78bfa"></sdpi-color>
    </sdpi-item>
    <sdpi-item label="Track color">
      <sdpi-color setting="trackColor" default="#2a2622"></sdpi-color>
    </sdpi-item>
    <sdpi-item label="Background color">
      <sdpi-color setting="bgColor" default="#0d0d0d"></sdpi-color>
    </sdpi-item>
  </details>

  <details>
    <summary>Text</summary>
    <sdpi-item label="5H title color">
      <sdpi-color setting="sessionLabelColor" default="#ffc9a8"></sdpi-color>
    </sdpi-item>
    <sdpi-item label="7D title color">
      <sdpi-color setting="weeklyLabelColor" default="#ffdf9e"></sdpi-color>
    </sdpi-item>
    <sdpi-item label="F title color">
      <sdpi-color setting="fableLabelColor" default="#d9c8ff"></sdpi-color>
    </sdpi-item>
    <sdpi-item label="Percent color">
      <sdpi-color setting="percentColor" default="#ffffff"></sdpi-color>
    </sdpi-item>
    <sdpi-item label="Reset text color">
      <sdpi-color setting="resetColor" default="#ffffff"></sdpi-color>
    </sdpi-item>
  </details>

  <details>
    <summary>Watermark</summary>
    <sdpi-item label="Color">
      <sdpi-color setting="watermarkColor" default="#ffffff"></sdpi-color>
    </sdpi-item>
    <sdpi-item label="Opacity">
      <sdpi-range setting="watermarkOpacity" min="0" max="0.4" step="0.01" default="0.15" showlabels></sdpi-range>
    </sdpi-item>
  </details>

  <details open>
    <summary>Polling</summary>
    <sdpi-item label="Refresh interval (sec)">
      <sdpi-range setting="pollSeconds" min="60" max="1800" step="30" default="60" showlabels></sdpi-range>
    </sdpi-item>
  </details>

  <details>
    <summary>Reset</summary>
    <sdpi-item label="">
      <sdpi-button id="resetBtn">Reset to defaults</sdpi-button>
    </sdpi-item>
  </details>

  <script>
    document.getElementById("resetBtn").addEventListener("click", () => {
      // sdpi-components keeps a reference to the underlying connection;
      // we set settings to {} which makes all defaults apply.
      const connection = window["streamDeckClient"] ?? window["SDPIComponents"]?.streamDeckClient;
      if (connection?.setSettings) {
        connection.setSettings({});
      } else {
        // fallback: reload the inspector
        location.reload();
      }
    });
  </script>

  <style>
    details { margin: 6px 0; }
    summary {
      font-weight: 600;
      cursor: pointer;
      padding: 4px 8px;
      color: var(--sdpi-color, #fff);
      opacity: 0.85;
    }
    summary:hover { opacity: 1; }
  </style>
</body>
</html>
